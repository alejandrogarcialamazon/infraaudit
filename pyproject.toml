[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infraaudit"
version = "1.0.0"
description = "CLI reutilizable para auditorías técnicas y health checks de infraestructura Linux, Docker y red"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "InfraAudit Contributors" },
]
keywords = ["audit", "infrastructure", "devops", "sre", "health-check", "ssh", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "paramiko>=3.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-paramiko>=3.4.0",
]

[project.scripts]
infraaudit = "infraaudit.cli:app"

[project.urls]
Documentation = "https://github.com/alejandrogarcialamazon/infraaudit"
Repository = "https://github.com/alejandrogarcialamazon/infraaudit"

[tool.hatch.build.targets.wheel]
packages = ["src/infraaudit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["integration: pruebas con servicios temporales en loopback (--run-integration)"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "B008",  # Typer uses function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["infraaudit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true
