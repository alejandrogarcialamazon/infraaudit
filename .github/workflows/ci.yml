name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
      - name: Loopback HTTP/TCP/TLS integration
        run: pytest --run-integration -m integration
      - name: Build and CLI smoke test
        run: |
          python -m build --no-isolation
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install --require-hashes -r requirements-runtime.lock
          /tmp/wheel-test/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/infraaudit version
          /tmp/wheel-test/bin/infraaudit doctor
          cd "$GITHUB_WORKSPACE"
          infraaudit version
          infraaudit validate examples/inventory.example.yml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t infraaudit:test .
      - run: docker run --rm infraaudit:test version
      - run: docker run --rm --read-only infraaudit:test doctor
